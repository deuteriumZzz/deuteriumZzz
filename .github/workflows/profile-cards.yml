
name: Update GitHub Profile Cards

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"

  # Allow manual execution
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Profile Cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate GitHub Profile Cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: deuteriumZzz

          cards: overview,contributions,lifetime,languages

          output-dir: assets
          themes: light,dark
          palette: blue
          language-limit: 8
          legend: scale

          commit: true
          commit-message: "chore(profile): refresh GitHub profile cards [skip ci]"
